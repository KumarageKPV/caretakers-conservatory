name: Unity CI/CD

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ dev, main ]

env:
  UNITY_VERSION: 2022.3.17f1

jobs:
  # This job only runs if Unity license secrets are configured
  test:
    name: Run EditMode Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Skip if secrets are not set (for forks or initial setup)
    if: github.event_name == 'push' && (secrets.UNITY_LICENSE != '' || secrets.UNITY_SERIAL != '')
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ env.UNITY_VERSION }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ env.UNITY_VERSION }}-
            Library-
            
      - name: Run Unity Tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: EditMode
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          checkName: EditMode Test Results
          
      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test results (EditMode)
          path: artifacts/

  build-windows:
    name: Build for Windows
    runs-on: windows-latest
    needs: test
    # Only build on main/dev branches AND if Unity secrets are configured
    if: |
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev') &&
      (secrets.UNITY_LICENSE != '' || secrets.UNITY_SERIAL != '')
    timeout-minutes: 60
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Windows-${{ env.UNITY_VERSION }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Windows-${{ env.UNITY_VERSION }}-
            Library-Windows-
            
      - name: Build Unity Project
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: StandaloneWindows64
          buildName: CaretakersConservatory
          buildsPath: build
          
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Build-Windows64
          path: build/StandaloneWindows64
          retention-days: 14

  lint:
    name: Code Linting
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '6.0.x'
          
      - name: Check EditorConfig
        run: |
          if [ -f .editorconfig ]; then
            echo "✓ EditorConfig found"
            cat .editorconfig
          else
            echo "⚠ EditorConfig not found"
          fi
        shell: bash
        
      - name: Verify Project Structure
        run: |
          echo "Checking required files..."
          [ -f "Assets/Scripts/WorldParams.cs" ] && echo "✓ WorldParams.cs" || echo "✗ WorldParams.cs missing"
          [ -f "Assets/Scripts/FanController.cs" ] && echo "✓ FanController.cs" || echo "✗ FanController.cs missing"
          [ -f "Packages/manifest.json" ] && echo "✓ manifest.json" || echo "✗ manifest.json missing"
          [ -f "CONTRIBUTING.md" ] && echo "✓ CONTRIBUTING.md" || echo "✗ CONTRIBUTING.md missing"
        shell: bash
